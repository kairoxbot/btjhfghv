services:
  - type: worker
    name: vnum-monitor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python vnum_monitor.py
    envVars:
      - key: DISCORD_WEBHOOK
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CHECK_INTERVAL
        value: "60"
